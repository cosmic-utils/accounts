name: Flatpak release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Ensure cargo-sources.json is up to date
        run: |
          apt-get update && apt-get install -y python3-pip
          pip install --break-system-packages aiohttp tomlkit
          curl -sL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o crates/ui/cargo-sources.json

      # Real OAuth client credentials never touch the repo. This patches the
      # placeholders in the checked-out working copy only — nothing here is
      # committed back — before flatpak-builder bundles the files into /app.
      - name: Inject OAuth credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: |
          apt-get update && apt-get install -y gettext
          ./crates/ui/data/providers/inject-credentials.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: accounts.flatpak
          manifest-path: crates/ui/dev.edfloreshz.Accounts.json
          cache-key: flatpak-builder-${{ github.sha }}
