[package]
name = "accounts_daemon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The headless credentials daemon for Accounts for COSMIC."
repository = "https://github.com/cosmic-utils/accounts"

[[bin]]
name = "accounts-daemon"
path = "src/main.rs"

[lib]
name = "accounts_daemon"
path = "src/lib.rs"

[dependencies]
accounts_core = { path = "../core" }
async-trait = "0.1.89"
base64 = "0.22"
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.41.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { workspace = true }
cosmic-config = { workspace = true }
oauth2 = { workspace = true }
secret-service = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zbus = { workspace = true }
zbus_polkit = { version = "5.0.0", default-features = false, features = ["tokio"] }
