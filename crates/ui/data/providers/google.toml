[provider]
id = "google"
name = "Google"
services = ["Email", "Calendar", "Contacts", "Todo"]
icon = "https://raw.githubusercontent.com/cosmic-utils/accounts/refs/heads/main/crates/ui/resources/img/google.png"        # remote URL — fetched async, cached

[oauth]
client_id = "${GOOGLE_CLIENT_ID}"
client_secret = "${GOOGLE_CLIENT_SECRET}"
auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://www.googleapis.com/oauth2/v3/token"
redirect_uri = "http://127.0.0.1:49173/callback"
scopes = [
    "openid",
    "email",
    "profile",
    "https://www.googleapis.com/auth/calendar",
    "https://www.googleapis.com/auth/contacts",
    "https://www.googleapis.com/auth/tasks",
    "https://mail.google.com/",
]

[oauth.extra_params]
access_type = "offline"
prompt = "consent"

[userinfo]
url = "https://www.googleapis.com/oauth2/v2/userinfo"
display_name_field = "name"
email_field = "email"

[endpoint.calendar]
uri_template = "https://apidata.googleusercontent.com/caldav/v2/"

[endpoint.contacts]
uri_template = "https://www.googleapis.com/.well-known/carddav"

[endpoint.tasks]
uri_template = "https://tasks.googleapis.com/tasks/v1/"

[endpoint.mail]
imap_host = "imap.gmail.com"
imap_port = 993
smtp_host = "smtp.gmail.com"
smtp_port = 587
