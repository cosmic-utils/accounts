[provider]
id = "microsoft"
name = "Microsoft"
dbus_name = "dev.edfloreshz.Accounts.Provider.Microsoft"
exec = "/usr/bin/accounts_provider_microsoft"
services = ["Email", "Calendar", "Contacts", "Todo"]
icon = "https://raw.githubusercontent.com/cosmic-utils/accounts/refs/heads/main/crates/ui/resources/img/microsoft.png"

[oauth]
client_id = "${MICROSOFT_CLIENT_ID}"
auth_url = "https://login.microsoftonline.com/common/oauth2/v2.0/authorize"
token_url = "https://login.microsoftonline.com/common/oauth2/v2.0/token"
redirect_uri = "dev.edfloreshz.accounts://oauth2redirect"
scopes = [
    "offline_access",
    "openid",
    "email",
    "profile",
    "https://graph.microsoft.com/user.read",
    "https://graph.microsoft.com/calendars.read",
    "https://graph.microsoft.com/contacts.read",
    "https://graph.microsoft.com/tasks.read",
    "https://graph.microsoft.com/tasks.read.shared",
    "https://graph.microsoft.com/tasks.readwrite",
    "https://graph.microsoft.com/tasks.readwrite.shared",
    "https://graph.microsoft.com/mail.read",
]

[oauth.extra_params]
